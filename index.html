<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quit Smoke Fit - CI/CD Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            background: white;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #2E3A59;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .stat-card {
            background: #E8F5E9;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #C8E6C9;
        }
        .stat-card h2 { margin: 0; color: #2E7D32; font-size: 32px; }
        .stat-card p { margin: 5px 0 0; color: #388E3C; font-weight: bold; }
        
        .craving-btn {
            background: #FF5252;
            color: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(255, 82, 82, 0.3);
        }
        .craving-btn:active { transform: scale(0.98); }
        
        .timer-box {
            display: none;
            background: #FFF3E0;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #FFE0B2;
        }
        .timer-box h3 { margin: 0 0 10px; color: #E65100; }
        .time-display { font-size: 36px; font-weight: bold; color: #F57C00; }
        
        .ranking {
            background: #F3F4F6;
            border-radius: 12px;
            padding: 15px;
        }
        .ranking h3 { margin: 0 0 10px; font-size: 16px; color: #374151; }
        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #E5E7EB;
        }
        .rank-item:last-child { border: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">Quit Smoke Fit</div>
    
    <div class="content">
        <div class="stat-card">
            <h2>14일차</h2>
            <p>누적 포인트: 1,450 P</p>
        </div>

        <button class="craving-btn" onclick="startTimer()">🚬 담배가 피고 싶어요!</button>

        <div class="timer-box" id="timerBox">
            <h3>🏃 대체 운동 5분 챌린지 (버피테스트)</h3>
            <div class="time-display" id="time">05:00</div>
            <p style="font-size: 12px; color: #666;">완료 시 +30P 즉시 적립!</p>
        </div>

        <div class="ranking">
            <h3>🏆 주간 실시간 랭킹</h3>
            <div class="rank-item"><span>1. 황(Hoang) 👑</span> <span>2,100 P</span></div>
            <div class="rank-item"><span>2. 핀(Pin)</span> <span>1,850 P</span></div>
            <div class="rank-item"><span>3. 팀원A</span> <span>1,450 P</span></div>
        </div>
    </div>
</div>

<script>
    function startTimer() {
        document.getElementById('timerBox').style.display = 'block';
        let timeLeft = 300; // 5 phút = 300 giây
        
        let timer = setInterval(function() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            
            document.getElementById('time').innerText = minutes + ":" + seconds;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                alert("운동 완료! 30P가 적립되었습니다. 랭킹이 상승합니다!");
                document.getElementById('timerBox').style.display = 'none';
            }
            timeLeft -= 1;
        }, 1000);
    }
</script>

</body>
</html>
